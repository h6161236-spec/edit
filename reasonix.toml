[permissions]
allow = ["Bash=git -C . log --oneline -20 2>/dev/null; echo \"---\"; git -C . status --short 2>/dev/null | head -30", "Bash=cd /e/xiangmu/edit && ls dist/ 2>/dev/null && find dist -name \"settings.json\" 2>/dev/null && echo \"---git check---\" && git ls-files | grep -iE \"settings\\.json|\\.vcutproj|dist/\" ; echo \"exit=$?\"", "Bash=grep -rniE \"claude|anthropic\" .git/ 2>/dev/null | head -20; echo \"=== git 对象中的字符串 ===\"; git log --all --format=\"%H %s\" | while read h rest; do git show -s --format=\"%B\" \"$h\" | grep -qiE \"claude|anthropic\" && echo \"COMMIT $h\"; done; echo done", "Bash=for d in docs build dist release packaging scripts models; do echo \"=== $d ===\"; find \"$d\" -type f 2>/dev/null | head -30; done", "Bash=for obj in $(git rev-list --objects --all 2>/dev/null | awk '{print $1}' | sort -u); do type=$(git cat-file -t \"$obj\" 2>/dev/null); if [ \"$type\" = \"blob\" ]; then git cat-file blob \"$obj\" 2>/dev/null | grep -qiE \"claude|anthropic\" && echo \"HIT in blob $obj\"; fi; done; echo \"=== 扫描完成 ===\"", "Bash=powershell -NoProfile -Command \"\nWrite-Output '=== CPU ==='\nGet-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List\nWrite-Output '=== 内存 ==='\n$cs = Get-CimInstance Win32_ComputerSystem\n$mem = Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum\nWrite-Output ('TotalRAM_GB: ' + [math]::Round($cs.TotalPhysicalMemory/1GB,1))\nWrite-Output ('Modules: ' + $mem.Count)\nWrite-Output '=== GPU ==='\nGet-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM, DriverVersion, VideoModeDescription | Format-List\nWrite-Output '=== OS ==='\nGet-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List\n\"", "Bash=nvidia-smi --query-gpu=name,memory.total,memory.free,driver_version --format=csv 2>/dev/null || powershell -NoProfile -Command \"Get-CimInstance Win32_VideoController | Where-Object { \\$_.Name -like '*NVIDIA*' } | Select-Object Name, AdapterRAM, PNPDeviceID | Format-List\"", "Bash=cd /e/xiangmu/edit && python -c \"import sys; sys.path.insert(0,'src'); import vcut_studio.app; import vcut_studio.ui.main_window; import vcut_studio.ui.workers; print('imports ok')\" 2>&1 | head -40"]
